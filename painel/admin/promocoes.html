<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Campanhas promocionais — Painel</title><link rel="stylesheet" href="/painel/assets/css/painel.css"><style>.promo-grid,.promo-form,.asset-list{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}.promo-card,.asset{border:1px solid #ddd;border-radius:10px;padding:12px}.promo-form label{display:block;font-size:13px}.promo-form input,.promo-form select,.promo-form textarea{width:100%;padding:9px;border:1px solid #ccd2cf;border-radius:7px}.asset img{width:100%;height:110px;object-fit:contain}.promo-preview{padding:18px;background:#f5f1e8;border-radius:10px}.promo-preview img{max-width:100%;max-height:180px;object-fit:contain}.muted{font-size:12px;color:#667}</style></head><body><div class="painel-layout"><aside class="painel-sidebar" data-sidebar></aside><main class="painel-main"><div class="painel-topo"><div><h1>Campanhas promocionais</h1><p class="texto-suave">Gerencie campanhas e reutilize artes na biblioteca.</p></div></div><div class="aviso-flash" data-flash></div>
<section class="painel-card"><h2>Nova campanha / edição</h2><form id="campaign-form"><input type="hidden" id="campaign-id"><div class="promo-form">
<div><label>Nome interno<input id="name" required maxlength="120"></label></div><div><label>Título do pop-up<input id="headline" maxlength="140"></label></div><div><label>Desconto<select id="discount-type"><option value="none">Não definido</option><option value="percent">Percentual (%)</option><option value="fixed">Valor fixo (R$)</option></select></label></div><div><label>Valor<input id="discount-value" type="number" min=".01" step=".01"></label></div>
<div><label>Início<input id="starts-at" type="datetime-local"></label></div><div><label>Encerramento automático<input id="ends-at" type="datetime-local"></label></div><div><label>Posição<select id="position"><option value="bottom-right">Inferior direita</option><option value="bottom-left">Inferior esquerda</option><option value="center">Centro</option><option value="top-left">Superior esquerda</option><option value="top-right">Superior direita</option></select></label></div><div><label>Reexibir após (dias)<input id="frequency" type="number" min="0" max="365" value="7"></label></div><div><label>Vagas reais (opcional)<input id="spots" type="number" min="1"></label></div><div><label>Texto do botão<input id="cta-label" value="Saiba mais" maxlength="40"></label></div><div><label>Destino HTTPS ou caminho do site<input id="cta-url" value="/pre-atendimento/" maxlength="500"></label></div><div><label><input id="active" type="checkbox"> Publicar dentro do período</label></div></div>
<label>Texto<textarea id="body" rows="3" maxlength="500"></textarea></label><h3>Imagens reutilizáveis</h3><div id="asset-picker" class="asset-list"></div><h3>Páginas de tratamento</h3><div id="page-picker" class="promo-form"></div><h3>Pré-visualização</h3><div id="preview" class="promo-preview"></div><p><button class="btn-p btn-p-dourado" type="submit">Salvar campanha</button> <button class="btn-p" type="button" id="new-campaign">Limpar</button></p></form></section>
<section class="painel-card"><h2>Biblioteca de imagens</h2><p class="muted">JPEG, PNG, WebP ou GIF até 10 MB. Envie uma vez e reutilize.</p><form id="asset-form" class="promo-form"><label>Nome<input id="asset-title" required maxlength="120"></label><label>Texto alternativo<input id="asset-alt" maxlength="250"></label><label>Arquivos<input id="asset-file" type="file" accept="image/jpeg,image/png,image/webp,image/gif" multiple required></label><button class="btn-p btn-p-dourado" type="submit">Enviar imagens</button></form><div id="library" class="asset-list"></div></section><section class="painel-card"><h2>Campanhas salvas</h2><div id="campaign-list" class="promo-grid"></div></section></main></div><script type="module" src="/painel/assets/js/promocoes-admin.js"></script><script src="/painel/assets/js/admin-sidebar.js"></script></body></html>
