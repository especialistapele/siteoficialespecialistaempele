<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><meta name="robots" content="noindex,nofollow"><title>Avisos — Painel</title><link rel="stylesheet" href="/painel/assets/css/painel.css"><link rel="icon" href="/assets/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="512x512" href="/assets/favicon-512.png">
<link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
</head><body><div class="painel-layout"><aside class="painel-sidebar" data-sidebar></aside><main class="painel-main"><div class="painel-topo"><div><h1>Avisos</h1><p class="texto-suave">Envie avisos gerais ou específicos para pacientes.</p></div><button class="btn-p btn-p-dourado" id="novo">Novo aviso</button></div><div class="aviso-flash" data-flash></div><div class="painel-card"><div style="overflow:auto"><table class="tabela-p"><thead><tr><th>Título</th><th>Destino</th><th>Data</th><th></th></tr></thead><tbody data-lista><tr><td colspan="4" class="painel-vazio">Carregando…</td></tr></tbody></table></div></div><div id="modal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.35);align-items:center;justify-content:center;padding:20px;z-index:20"><div class="painel-card" style="width:min(620px,100%)"><h2>Novo aviso</h2><form id="form"><div class="form-campo"><label>Título</label><input id="title" required></div><div class="form-campo"><label>Mensagem</label><textarea id="message" rows="5" required></textarea></div><div class="form-campo"><label>Paciente (opcional)</label><select id="patient"><option value="">Todos os pacientes</option></select></div><div class="form-acoes"><button type="button" class="btn-p btn-p-fora" id="fechar">Cancelar</button><button class="btn-p btn-p-dourado">Publicar aviso</button></div></form></div></div></main></div><script type="module">import{supabase,exigirAdmin,configurarBotaoSair,mostrarFlash}from'/painel/assets/js/painel-auth.js';import{renderSidebarAdmin}from'/painel/assets/js/admin-sidebar.js';const ctx=await exigirAdmin();if(!ctx)throw Error('sem acesso');document.querySelector('[data-sidebar]').innerHTML=renderSidebarAdmin('anuncios',ctx.perfil.full_name);configurarBotaoSair();const flash=document.querySelector('[data-flash]'),modal=document.getElementById('modal');const esc=s=>String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));async function carregar(){const{data,error}=await supabase.from('announcements').select('*, patients(full_name)').order('created_at',{ascending:false});const tb=document.querySelector('[data-lista]');if(error){tb.innerHTML=`<tr><td colspan="4" class="painel-vazio">${esc(error.message)}</td></tr>`;return}tb.innerHTML=data?.length?data.map(a=>`<tr><td><strong>${esc(a.title)}</strong><div class="texto-suave">${esc(a.message).slice(0,90)}</div></td><td>${a.patient_id?esc(a.patients?.full_name||'Paciente'):'Todos'}</td><td>${new Date(a.created_at).toLocaleDateString('pt-BR')}</td><td><button class="btn-p btn-p-mini btn-p-perigo" data-del="${a.id}">Excluir</button></td></tr>`).join(''):`<tr><td colspan="4" class="painel-vazio">Nenhum aviso.</td></tr>`;tb.querySelectorAll('[data-del]').forEach(b=>b.onclick=async()=>{const{error}=await supabase.from('announcements').delete().eq('id',b.dataset.del);if(error)mostrarFlash(flash,error.message,'erro');carregar()})}const{data:patients}=await supabase.from('patients').select('id,full_name').order('full_name');document.getElementById('patient').innerHTML='<option value="">Todos os pacientes</option>'+(patients||[]).map(p=>`<option value="${p.id}">${esc(p.full_name)}</option>`).join('');document.getElementById('novo').onclick=()=>modal.style.display='flex';document.getElementById('fechar').onclick=()=>modal.style.display='none';document.getElementById('form').onsubmit=async e=>{e.preventDefault();const{error}=await supabase.from('announcements').insert({title:document.getElementById('title').value.trim(),message:document.getElementById('message').value.trim(),patient_id:document.getElementById('patient').value||null});if(error){mostrarFlash(flash,error.message,'erro');return}e.target.reset();modal.style.display='none';mostrarFlash(flash,'Aviso publicado.','sucesso');carregar()};carregar();</script></body></html>
