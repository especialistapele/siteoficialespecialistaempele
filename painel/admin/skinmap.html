<!DOCTYPE html>
<html lang="pt-BR"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="robots" content="noindex,nofollow"><title>SkinMap — Leads | Painel</title>
<link rel="stylesheet" href="/painel/assets/css/painel.css"><link rel="icon" href="/assets/favicon.ico" sizes="any">
<style>
.skinmap-filtros{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:18px;align-items:flex-end}
.skinmap-filtros label{display:flex;flex-direction:column;gap:6px;font-size:12px;font-weight:700}
.skinmap-filtros input,.skinmap-filtros select{font:inherit;font-weight:400;padding:10px 12px;border:1px solid var(--linha);border-radius:8px;background:#fff;color:var(--ink)}
.skinmap-filtros input{min-width:min(320px,80vw)}.skinmap-status{min-width:130px}
.skinmap-detalhes summary{cursor:pointer;font-weight:700;color:var(--ink)}
.skinmap-detalhes summary{padding:8px 0}
.skinmap-analise{min-width:260px;max-width:460px;padding:12px 0;color:var(--ink)}
.skinmap-analise h4{font-size:13px;margin:14px 0 7px;color:var(--ink)}
.skinmap-analise h4:first-child{margin-top:0}
.skinmap-resposta{padding:9px 0;border-bottom:1px solid var(--linha)}
.skinmap-pergunta{font-size:12px;color:var(--muted);margin-bottom:4px}
.skinmap-valor{font-size:13px;line-height:1.5;overflow-wrap:anywhere}
.skinmap-analise-vazio{font-size:12px;color:var(--muted);padding:8px 0}
.skinmap-tabela td{vertical-align:top}.skinmap-tabela select{max-width:150px;padding:8px;border:1px solid var(--linha);border-radius:7px;background:white}
.skinmap-resumo{max-width:260px;white-space:pre-wrap}
@media(max-width:700px){.skinmap-filtros{align-items:stretch}.skinmap-filtros label,.skinmap-filtros input{width:100%;min-width:0}}
</style></head><body>
<div class="painel-layout"><aside class="painel-sidebar" data-sidebar></aside><main class="painel-main">
<div class="painel-topo"><div><h1>SkinMap</h1><p class="texto-suave">Solicitações concluídas no SkinMap, separadas dos pré-atendimentos.</p></div><button type="button" class="btn-p btn-p-dourado" id="atualizar-skinmap">↻ Atualizar</button></div>
<div class="aviso-flash" data-flash></div>
<div class="skinmap-filtros">
<label>Buscar contato<input id="busca-skinmap" type="search" placeholder="Nome, WhatsApp, e-mail ou cidade" autocomplete="off"></label>
<label>Status<select id="status-skinmap" class="skinmap-status"><option value="todos">Todos</option><option value="novo">Novo</option><option value="contato">Em contato</option><option value="convertido">Convertido</option><option value="arquivado">Arquivado</option></select></label>
</div>
<div class="painel-card"><div style="overflow:auto"><table class="tabela-p skinmap-tabela"><thead><tr><th>Contato</th><th>Perfil inicial</th><th>Interesse</th><th>Recebido em</th><th>Ambiente</th><th>Status</th><th>Dados SkinMap</th></tr></thead><tbody data-lista><tr><td colspan="7" class="painel-vazio">Carregando solicitações…</td></tr></tbody></table></div></div>
</main></div>
<script type="module">
import { supabase, exigirAdmin, configurarBotaoSair, mostrarFlash } from '/painel/assets/js/painel-auth.js';
import { renderSidebarAdmin } from '/painel/assets/js/admin-sidebar.js';
import { QUESTION_DEFINITIONS } from '/skinmap/js/engine-v2/variables/questionDefinitions.js';
const ctx = await exigirAdmin();
if (!ctx || !ctx.session?.access_token) throw new Error('Sessão administrativa não encontrada.');
document.querySelector('[data-sidebar]').innerHTML = renderSidebarAdmin('skinmap', ctx.perfil.full_name);
configurarBotaoSair();
const flash=document.querySelector('[data-flash]'), lista=document.querySelector('[data-lista]'), busca=document.querySelector('#busca-skinmap'), filtroStatus=document.querySelector('#status-skinmap');
let leads=[];
const esc=(v)=>String(v??'').replace(/[&<>"']/g,(c)=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const dataPt=(v)=>{if(!v)return '—';const d=new Date(v);return Number.isNaN(d.getTime())?'—':d.toLocaleString('pt-BR',{dateStyle:'short',timeStyle:'short'});};
const statusLabel={novo:'Novo',contato:'Em contato',convertido:'Convertido',arquivado:'Arquivado'};
const perfilLabels={
 age_range:'Faixa etária',skin_type:'Como percebe a pele',hydration_level:'Hidratação',sensitivity_level:'Sensibilidade',
 barrier_level:'Barreira cutânea',texture_level:'Textura',appearance_level:'Aspecto da pele',consultation_intention:'Objetivo da consulta',
 product_usage_notes:'Produtos utilizados',additional_notes:'Observações adicionais',skin_observations:'Observações sobre a pele',
 characteristics:'Características percebidas',goals:'Objetivos',routine_patterns:'Hábitos de rotina',regenerative_context:'Contexto de regeneração',
 current_products:'Produtos atuais',lifestyle_factors:'Fatores de estilo de vida',photoaging_context:'Contexto de fotoenvelhecimento'
};
const rotulo=(v)=>String(v??'').replace(/_/g,' ').replace(/\\b\\w/g,(m)=>m.toLocaleUpperCase('pt-BR'));
function valorLegivel(v){
 if(v===null||v===undefined||v==='')return '';
 if(Array.isArray(v))return v.map(valorLegivel).filter(Boolean).join(', ');
 if(typeof v==='object')return '';
 const s=String(v);
 const map={normal:'Equilibrada',dry:'Mais seca',oily:'Mais oleosa',combination:'Mista',low:'Baixo',medium:'Moderado',high:'Alto',very_high:'Muito alto',yes:'Sim',no:'Não',true:'Sim',false:'Não'};
 return map[s]||rotulo(s);
}
function renderAnalise(l){
 const a=l.assessment&&typeof l.assessment==='object'?l.assessment:{};
 const p=l.skin_profile&&typeof l.skin_profile==='object'?l.skin_profile:{};
 const q=l.questionnaire&&typeof l.questionnaire==='object'?l.questionnaire:{};
 const respostas=Array.isArray(q.answers)?q.answers:(Array.isArray(q)?q:[]);
 const preferencias=q.consultation_preferences&&typeof q.consultation_preferences==='object'?q.consultation_preferences:{};
 const outrasPreferencias=[
  ['Melhor horário para contato',preferencias.preferred_time],
  ['Interesse principal',preferencias.interest||l.interest],
  ['Como conheceu o SkinMap',preferencias.indication||l.indication],
  ['Detalhe da origem',preferencias.other_indication||l.other_indication]
 ].filter(([,v])=>v!==null&&v!==undefined&&String(v).trim()!=='');
 let html='';
 if(a.summary)html+='<h4>Resumo da análise</h4><div class="skinmap-resposta"><div class="skinmap-valor">'+esc(a.summary)+'</div></div>';
 const campos=Object.entries(perfilLabels).filter(([k])=>p[k]!==null&&p[k]!==undefined&&p[k]!==''&&!(Array.isArray(p[k])&&!p[k].length));
 if(campos.length)html+='<h4>Perfil de pele informado</h4>'+campos.map(([k,label])=>'<div class="skinmap-resposta"><div class="skinmap-pergunta">'+esc(label)+'</div><div class="skinmap-valor">'+esc(valorLegivel(p[k]))+'</div></div>').join('');
 if(respostas.length){
  html+='<h4>Respostas do paciente</h4>'+respostas.map((r)=>{
   const id=r.question_id||r.key||'';
   const def=QUESTION_DEFINITIONS[id]||{};
   const pergunta=def.question||r.question||perfilLabels[id]||'Resposta informada';
   let valores=[];
   if(Array.isArray(r.selected_values))valores=r.selected_values.map((v)=>def.options?.find((o)=>o.value===v)?.label||valorLegivel(v));
   if(r.text_response?.trim())valores.push(r.text_response.trim());
   if(!valores.length&&r.answer!==undefined)valores.push(valorLegivel(r.answer));
   if(!valores.length)return '';
   return '<div class="skinmap-resposta"><div class="skinmap-pergunta">'+esc(pergunta)+'</div><div class="skinmap-valor">'+esc(valores.join(', '))+'</div></div>';
  }).join('');
 }
 if(outrasPreferencias.length)html+='<h4>Preferências de contato</h4>'+outrasPreferencias.map(([label,value])=>'<div class="skinmap-resposta"><div class="skinmap-pergunta">'+esc(label)+'</div><div class="skinmap-valor">'+esc(value)+'</div></div>').join('');
 if(!html)html='<div class="skinmap-analise-vazio">Não há respostas detalhadas disponíveis para este registro.</div>';
 return '<div class="skinmap-analise">'+html+'</div>';
}
function render(){
 const termo=busca.value.trim().toLocaleLowerCase('pt-BR'), status=filtroStatus.value;
 const filtrados=leads.filter((l)=>[l.full_name,l.whatsapp,l.email,l.city].some((v)=>String(v||'').toLocaleLowerCase('pt-BR').includes(termo))&&(status==='todos'||l.status===status));
 if(!filtrados.length){lista.innerHTML='<tr><td colspan="7" class="painel-vazio">Nenhuma solicitação encontrada.</td></tr>';return;}
 lista.innerHTML=filtrados.map((l)=>{
  return '<tr><td><strong>'+esc(l.full_name)+'</strong><br>'+esc(l.whatsapp)+'<br><a href="mailto:'+esc(l.email)+'">'+esc(l.email)+'</a><br>'+esc(l.city||'Cidade não informada')+'</td>'+
   '<td>'+esc(l.skin_type||l.assessment?.skin_type||'—')+'<div class="skinmap-resumo">'+esc(l.assessment?.summary||'')+'</div></td>'+
   '<td>'+esc(l.interest||'—')+'<br><small>Origem: '+esc(l.indication||'—')+'</small>'+(l.questionnaire?.consultation_preferences?.preferred_time?'<br><small>Horário: '+esc(l.questionnaire.consultation_preferences.preferred_time)+'</small>':'')+'</td><td>'+esc(dataPt(l.created_at))+'</td><td>'+((l.source_environment==='preview')?'<strong>Teste</strong>':'Produção')+'</td>'+
   '<td><select aria-label="Status de '+esc(l.full_name)+'" data-status-id="'+esc(l.id)+'">'+Object.keys(statusLabel).map((k)=>'<option value="'+k+'"'+(l.status===k?' selected':'')+'>'+statusLabel[k]+'</option>').join('')+'</select></td>'+
   '<td><details class="skinmap-detalhes"><summary>Ver análise</summary>'+renderAnalise(l)+'</details></td></tr>';
 }).join('');
 lista.querySelectorAll('[data-status-id]').forEach((s)=>s.addEventListener('change',async()=>{
  s.disabled=true;const {error}=await supabase.from('skinmap_leads').update({status:s.value}).eq('id',s.dataset.statusId);s.disabled=false;
  if(error){mostrarFlash(flash,'Não foi possível atualizar o status.','erro');await carregar();return;}
  const lead=leads.find((x)=>x.id===s.dataset.statusId);if(lead)lead.status=s.value;
  mostrarFlash(flash,'Status do lead atualizado.','sucesso');render();
 }));
}
async function carregar(){
 lista.innerHTML='<tr><td colspan="7" class="painel-vazio">Carregando solicitações…</td></tr>';
 const {data,error}=await supabase.from('skinmap_leads').select('id,full_name,whatsapp,email,city,interest,indication,other_indication,skin_type,assessment,skin_profile,questionnaire,consent,consent_text_version,consented_at,status,created_at,source_environment').order('created_at',{ascending:false});
 if(error){lista.innerHTML='<tr><td colspan="7" class="painel-vazio">Não foi possível carregar os leads. Verifique a migração e as permissões administrativas.</td></tr>';mostrarFlash(flash,'Falha ao carregar SkinMap.','erro');return;}
 leads=data||[];render();
}
busca.addEventListener('input',render);filtroStatus.addEventListener('change',render);document.querySelector('#atualizar-skinmap').addEventListener('click',carregar);
await carregar();
</script></body></html>
