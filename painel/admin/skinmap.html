<!DOCTYPE html>
<html lang="pt-BR"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="robots" content="noindex,nofollow"><title>SkinMap — Leads | Painel</title>
<link rel="stylesheet" href="/painel/assets/css/painel.css"><link rel="icon" href="/assets/favicon.ico" sizes="any">
<style>
.skinmap-filtros{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:18px;align-items:flex-end}
.skinmap-filtros label{display:flex;flex-direction:column;gap:6px;font-size:12px;font-weight:700}
.skinmap-filtros input,.skinmap-filtros select{font:inherit;font-weight:400;padding:10px 12px;border:1px solid var(--linha);border-radius:8px;background:#fff;color:var(--ink)}
.skinmap-filtros input{min-width:min(320px,80vw)}.skinmap-status{min-width:130px}
.skinmap-detalhes summary{cursor:pointer;font-weight:700;color:var(--ink)}
.skinmap-detalhes pre{white-space:pre-wrap;overflow-wrap:anywhere;max-width:520px;max-height:280px;overflow:auto;font-size:12px;background:#f7f7f7;padding:12px;border-radius:8px}
.skinmap-tabela td{vertical-align:top}.skinmap-tabela select{max-width:150px;padding:8px;border:1px solid var(--linha);border-radius:7px;background:white}
.skinmap-resumo{max-width:260px;white-space:pre-wrap}
@media(max-width:700px){.skinmap-filtros{align-items:stretch}.skinmap-filtros label,.skinmap-filtros input{width:100%;min-width:0}}
</style></head><body>
<div class="painel-layout"><aside class="painel-sidebar" data-sidebar></aside><main class="painel-main">
<div class="painel-topo"><div><h1>SkinMap</h1><p class="texto-suave">Solicitações concluídas no SkinMap, separadas dos pré-atendimentos.</p></div><button type="button" class="btn-p btn-p-dourado" id="atualizar-skinmap">↻ Atualizar</button></div>
<div class="aviso-flash" data-flash></div>
<div class="skinmap-filtros">
<label>Buscar contato<input id="busca-skinmap" type="search" placeholder="Nome, WhatsApp, e-mail ou cidade" autocomplete="off"></label>
<label>Status<select id="status-skinmap" class="skinmap-status"><option value="todos">Todos</option><option value="novo">Novo</option><option value="contato">Em contato</option><option value="convertido">Convertido</option><option value="arquivado">Arquivado</option></select></label>
</div>
<div class="painel-card"><div style="overflow:auto"><table class="tabela-p skinmap-tabela"><thead><tr><th>Contato</th><th>Perfil inicial</th><th>Interesse</th><th>Recebido em</th><th>Status</th><th>Dados SkinMap</th></tr></thead><tbody data-lista><tr><td colspan="6" class="painel-vazio">Carregando solicitações…</td></tr></tbody></table></div></div>
</main></div>
<script type="module">
import { supabase, exigirAdmin, configurarBotaoSair, mostrarFlash } from '/painel/assets/js/painel-auth.js';
import { renderSidebarAdmin } from '/painel/assets/js/admin-sidebar.js';
const ctx = await exigirAdmin();
if (!ctx || !ctx.session?.access_token) throw new Error('Sessão administrativa não encontrada.');
document.querySelector('[data-sidebar]').innerHTML = renderSidebarAdmin('skinmap', ctx.perfil.full_name);
configurarBotaoSair();
const flash=document.querySelector('[data-flash]'), lista=document.querySelector('[data-lista]'), busca=document.querySelector('#busca-skinmap'), filtroStatus=document.querySelector('#status-skinmap');
let leads=[];
const esc=(v)=>String(v??'').replace(/[&<>"']/g,(c)=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const dataPt=(v)=>{if(!v)return '—';const d=new Date(v);return Number.isNaN(d.getTime())?'—':d.toLocaleString('pt-BR',{dateStyle:'short',timeStyle:'short'});};
const statusLabel={novo:'Novo',contato:'Em contato',convertido:'Convertido',arquivado:'Arquivado'};
function render(){
 const termo=busca.value.trim().toLocaleLowerCase('pt-BR'), status=filtroStatus.value;
 const filtrados=leads.filter((l)=>[l.full_name,l.whatsapp,l.email,l.city].some((v)=>String(v||'').toLocaleLowerCase('pt-BR').includes(termo))&&(status==='todos'||l.status===status));
 if(!filtrados.length){lista.innerHTML='<tr><td colspan="6" class="painel-vazio">Nenhuma solicitação encontrada.</td></tr>';return;}
 lista.innerHTML=filtrados.map((l)=>{
  const dados=JSON.stringify({avaliacao:l.assessment||{},perfil:l.skin_profile||{},respostas:l.questionnaire||{},consentimento:{autorizado:l.consent,versao:l.consent_text_version,em:l.consented_at}},null,2);
  return '<tr><td><strong>'+esc(l.full_name)+'</strong><br>'+esc(l.whatsapp)+'<br><a href="mailto:'+esc(l.email)+'">'+esc(l.email)+'</a><br>'+esc(l.city||'Cidade não informada')+'</td>'+
   '<td>'+esc(l.skin_type||l.assessment?.skin_type||'—')+'<div class="skinmap-resumo">'+esc(l.assessment?.summary||'')+'</div></td>'+
   '<td>'+esc(l.interest||'—')+'<br><small>Origem: '+esc(l.indication||'—')+'</small></td><td>'+esc(dataPt(l.created_at))+'</td>'+
   '<td><select aria-label="Status de '+esc(l.full_name)+'" data-status-id="'+esc(l.id)+'">'+Object.keys(statusLabel).map((k)=>'<option value="'+k+'"'+(l.status===k?' selected':'')+'>'+statusLabel[k]+'</option>').join('')+'</select></td>'+
   '<td><details class="skinmap-detalhes"><summary>Ver análise</summary><pre>'+esc(dados)+'</pre></details></td></tr>';
 }).join('');
 lista.querySelectorAll('[data-status-id]').forEach((s)=>s.addEventListener('change',async()=>{
  s.disabled=true;const {error}=await supabase.from('skinmap_leads').update({status:s.value}).eq('id',s.dataset.statusId);s.disabled=false;
  if(error){mostrarFlash(flash,'Não foi possível atualizar o status.','erro');await carregar();return;}
  const lead=leads.find((x)=>x.id===s.dataset.statusId);if(lead)lead.status=s.value;
  mostrarFlash(flash,'Status do lead atualizado.','sucesso');render();
 }));
}
async function carregar(){
 lista.innerHTML='<tr><td colspan="6" class="painel-vazio">Carregando solicitações…</td></tr>';
 const {data,error}=await supabase.from('skinmap_leads').select('id,full_name,whatsapp,email,city,interest,indication,skin_type,assessment,skin_profile,questionnaire,consent,consent_text_version,consented_at,status,created_at').order('created_at',{ascending:false});
 if(error){lista.innerHTML='<tr><td colspan="6" class="painel-vazio">Não foi possível carregar os leads. Verifique a migração e as permissões administrativas.</td></tr>';mostrarFlash(flash,'Falha ao carregar SkinMap.','erro');return;}
 leads=data||[];render();
}
busca.addEventListener('input',render);filtroStatus.addEventListener('change',render);document.querySelector('#atualizar-skinmap').addEventListener('click',carregar);
await carregar();
</script></body></html>
