<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>Anamnese — Especialista em Pele</title>
<link rel="stylesheet" href="/painel/assets/css/painel.css">
<style>
.anamnese-wrap{max-width:980px;margin:0 auto}.anamnese-head{margin-bottom:18px}.anamnese-hero{padding:24px 26px;border:1px solid var(--linha,#ddd7c9);border-radius:16px;background:linear-gradient(135deg,#fffdf9,#f7f9f7);box-shadow:0 8px 24px rgba(38,49,45,.06)}.anamnese-kicker{font-size:11px;letter-spacing:.12em;text-transform:uppercase;font-weight:800;color:#7d827c;margin-bottom:7px}.anamnese-hero h1{margin:0 0 7px;font-size:clamp(25px,4vw,34px);letter-spacing:-.02em}.anamnese-hero p{margin:0;max-width:720px;line-height:1.6}.anamnese-progress{margin-top:18px}.anamnese-progress__top{display:flex;justify-content:space-between;gap:12px;align-items:center;font-size:12px;color:#6f746f;margin-bottom:7px}.anamnese-progress__bar{height:7px;background:#e8e7df;border-radius:999px;overflow:hidden}.anamnese-progress__fill{height:100%;width:0;background:#5b7567;border-radius:999px;transition:width .25s ease}.anamnese-form-card{margin-top:18px;padding:24px 26px;border:1px solid var(--linha,#ddd7c9);border-radius:16px;background:#fff;box-shadow:0 8px 24px rgba(38,49,45,.045)}.anamnese-section{margin-top:26px}.anamnese-section-title{margin:0;padding-bottom:11px;border-bottom:1px solid var(--linha,#ddd7c9);font-size:18px}.anamnese-question{padding:20px 0;border-bottom:1px solid #ecebe5}.anamnese-question:last-child{border-bottom:0}.anamnese-question label.titulo{display:block;font-weight:750;margin-bottom:9px;font-size:15px;line-height:1.45}.anamnese-help{font-size:12.5px;color:#777;margin:-2px 0 12px;line-height:1.5}.anamnese-question input[type=text],.anamnese-question input[type=number],.anamnese-question select,.anamnese-question textarea{width:100%;box-sizing:border-box}.opcoes{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:9px}.opcao{display:flex;align-items:center;gap:10px;padding:11px 13px;border:1px solid #e4e2da;border-radius:10px;background:#fcfcfa;font-weight:500;cursor:pointer;transition:.15s}.opcao:hover{border-color:#b9c6bf;background:#f7faf8}.opcao input{margin:0;accent-color:#5b7567}.erro-campo{color:#a33;font-size:12px;margin-top:7px}.anamnese-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:26px;padding-top:20px;border-top:1px solid var(--linha,#ddd7c9)}.anamnese-status{padding:18px;border-radius:12px;background:rgba(78,122,69,.08);font-size:13px;line-height:1.55}.previous-answer{margin:10px 0;padding:13px;border:1px solid #d8e2dc;border-radius:10px;background:#f7faf8;font-size:13px}.previous-answer button{margin:9px 8px 0 0}.assinatura-wrap{margin-top:18px;border:1px dashed #c9d0ca;border-radius:12px;background:#fcfcfa}.assinatura-wrap canvas{display:block;width:100%;height:180px;touch-action:none}.loading{padding:55px;text-align:center}.dados-pessoais{margin-bottom:0}.dados-pessoais h3{font-size:18px}.dados-aviso{padding:13px 15px;border-radius:10px;background:#f5f8f6;border:1px solid #e1e8e3;font-size:13px;line-height:1.5;margin-bottom:18px}.dados-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px 16px}.dados-grid .campo{display:flex;flex-direction:column;gap:6px}.dados-grid .campo--full{grid-column:1/-1}.dados-grid label{font-weight:700;font-size:13px}.dados-grid input,.dados-grid select{width:100%;box-sizing:border-box}@media(max-width:700px){.anamnese-hero,.anamnese-form-card{padding:20px 16px;border-radius:12px}.opcoes{grid-template-columns:1fr}.anamnese-question{padding:17px 0}.dados-grid{grid-template-columns:1fr}.dados-grid .campo--full{grid-column:auto}}
</style>
</head>
<body>
<div class="painel-layout">
<aside class="painel-sidebar">
  <div class="painel-sidebar__marca"><div class="selo-ep"><img src="/painel/assets/img/logo-especialista.webp" alt="Especialista em Pele"></div></div>
  <nav>
    <a href="/painel/paciente/painel.html"><span>← Meu espaço</span></a>
    <a href="/painel/paciente/painel.html#prontuario"><span>Prontuário</span></a>
    <a href="/painel/paciente/painel.html#contratos"><span>Contratos</span></a>
  </nav>
</aside>
<main class="painel-main"><div class="anamnese-wrap">
  <div class="painel-topo anamnese-head"><div class="anamnese-hero"><div class="anamnese-kicker">Ficha clínica</div><h1 data-titulo>Anamnese</h1><p data-subtitulo>Carregando…</p><div class="anamnese-progress" data-progress-wrap><div class="anamnese-progress__top"><span data-progress-label>Progresso da ficha</span><strong data-progress-count>0%</strong></div><div class="anamnese-progress__bar"><div class="anamnese-progress__fill" data-progress-fill></div></div></div></div></div>
  <div class="painel-card" data-root><div class="loading estado-carregando" role="status" aria-live="polite">Carregando ficha…</div></div>
</div></main>
</div>
<script type="module">
import { supabase, exigirPaciente, configurarBotaoSair } from "/painel/assets/js/painel-auth.js";
import { criarAssinatura } from "/painel/assets/js/assinatura-canvas.js";
const contexto = await exigirPaciente(); if (!contexto) throw new Error("sem acesso");
configurarBotaoSair();
const patientId = contexto.paciente.id;
const { data: cadastroPaciente, error: cadastroErr } = await supabase
  .from("patients")
  .select("id,full_name,cpf,rg,birth_date,address,address_number,address_complement,neighborhood,city,state,cep,phone,email,profession,children,blood_type")
  .eq("id",patientId)
  .single();
if (cadastroErr || !cadastroPaciente) throw cadastroErr || new Error("Cadastro do paciente não encontrado");

function valorCadastro(campo){ return cadastroPaciente?.[campo] ?? ""; }
function idadePorData(data){
  if(!data) return "";
  const hoje=new Date(), nasc=new Date(data+"T00:00:00");
  let idade=hoje.getFullYear()-nasc.getFullYear();
  const m=hoje.getMonth()-nasc.getMonth();
  if(m<0 || (m===0 && hoje.getDate()<nasc.getDate())) idade--;
  return idade>=0 ? idade : "";
}
function montarDadosPessoais(){
  return `
    <section class="dados-pessoais painel-card" data-dados-pessoais>
      <h3 style="margin-top:0">Dados pessoais</h3>
      <div class="dados-aviso">Confira seus dados cadastrais. Eles serão registrados junto à anamnese e utilizados para identificar corretamente sua ficha e futuros documentos.</div>
      <div class="dados-grid">
        <div class="campo campo--full"><label for="cad-full_name">Nome completo *</label><input id="cad-full_name" data-cad="full_name" type="text" value="${escapeHtml(valorCadastro("full_name"))}" required></div>
        <div class="campo"><label for="cad-cpf">CPF *</label><input id="cad-cpf" data-cad="cpf" type="text" inputmode="numeric" autocomplete="off" value="${escapeHtml(valorCadastro("cpf"))}" required></div>
        <div class="campo"><label for="cad-rg">RG</label><input id="cad-rg" data-cad="rg" type="text" value="${escapeHtml(valorCadastro("rg"))}"></div>
        <div class="campo"><label for="cad-birth_date">Data de nascimento *</label><input id="cad-birth_date" data-cad="birth_date" type="date" value="${escapeHtml(valorCadastro("birth_date"))}" required></div>
        <div class="campo"><label>Idade</label><input type="text" value="${escapeHtml(idadePorData(valorCadastro("birth_date")))}" data-idade readonly></div>
        <div class="campo campo--full"><label for="cad-address">Endereço</label><input id="cad-address" data-cad="address" type="text" value="${escapeHtml(valorCadastro("address"))}"></div>
        <div class="campo"><label for="cad-address_number">Número</label><input id="cad-address_number" data-cad="address_number" type="text" value="${escapeHtml(valorCadastro("address_number"))}"></div>
        <div class="campo"><label for="cad-address_complement">Complemento</label><input id="cad-address_complement" data-cad="address_complement" type="text" value="${escapeHtml(valorCadastro("address_complement"))}"></div>
        <div class="campo"><label for="cad-neighborhood">Bairro</label><input id="cad-neighborhood" data-cad="neighborhood" type="text" value="${escapeHtml(valorCadastro("neighborhood"))}"></div>
        <div class="campo"><label for="cad-city">Cidade</label><input id="cad-city" data-cad="city" type="text" value="${escapeHtml(valorCadastro("city"))}"></div>
        <div class="campo"><label for="cad-state">Estado</label><input id="cad-state" data-cad="state" type="text" maxlength="2" autocapitalize="characters" autocomplete="address-level1" value="${escapeHtml(valorCadastro("state"))}"></div>
        <div class="campo"><label for="cad-cep">CEP</label><input id="cad-cep" data-cad="cep" type="text" inputmode="numeric" autocomplete="postal-code" value="${escapeHtml(valorCadastro("cep"))}"></div>
        <div class="campo"><label for="cad-phone">Telefone</label><input id="cad-phone" data-cad="phone" type="tel" inputmode="tel" autocomplete="tel" value="${escapeHtml(valorCadastro("phone"))}"></div>
        <div class="campo"><label for="cad-email">E-mail</label><input id="cad-email" data-cad="email" type="email" value="${escapeHtml(valorCadastro("email"))}"></div>
        <div class="campo"><label for="cad-profession">Profissão</label><input id="cad-profession" data-cad="profession" type="text" value="${escapeHtml(valorCadastro("profession"))}"></div>
        <div class="campo"><label for="cad-children">Filhos</label><input id="cad-children" data-cad="children" type="text" value="${escapeHtml(valorCadastro("children"))}"></div>
        <div class="campo"><label for="cad-blood_type">Tipo sanguíneo</label><select id="cad-blood_type" data-cad="blood_type"><option value="">Selecione…</option>${["A+","A-","B+","B-","AB+","AB-","O+","O-"].map(v=>`<option value="${v}" ${valorCadastro("blood_type")===v?"selected":""}>${v}</option>`).join("")}</select></div>
      </div>
    </section>
  `;
}

const versionId = new URLSearchParams(location.search).get("version");
const root = document.querySelector("[data-root]");
const escapeHtml = (v) => String(v ?? "").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));
if (!versionId) { root.innerHTML='<p class="texto-suave">Ficha não informada.</p>'; throw new Error("sem versão"); }

const [{data:version,error:verErr},{data:types},{data:permissions}] = await Promise.all([
  supabase.from("anamnesis_versions").select("id,patient_id,anamnesis_type_id,version_number,status,released_at,submitted_at,locked_at").eq("id",versionId).eq("patient_id",patientId).not("released_at","is",null).single(),
  supabase.from("anamnesis_types").select("id,code,name,description").eq("active",true),
  supabase.from("anamnesis_edit_permissions").select("id,status,expires_at").eq("anamnesis_version_id",versionId).eq("patient_id",patientId).eq("status","active").order("granted_at",{ascending:false}).limit(1)
]);
if (verErr || !version) { root.innerHTML='<p class="texto-suave">Não foi possível carregar esta ficha.</p>'; throw verErr || new Error("ficha inexistente"); }
const type = types?.find(t=>t.id===version.anamnesis_type_id);
document.querySelector("[data-titulo]").textContent = type?.name || "Anamnese";
document.querySelector("[data-subtitulo]").textContent = type?.description || "Preencha as informações solicitadas com atenção.";

const canEdit = version.status === "draft" || (permissions?.length && permissions[0].status==="active" && (!permissions[0].expires_at || new Date(permissions[0].expires_at)>new Date()));
const [{data:questions,error:qErr},{data:responses}] = await Promise.all([
  supabase.from("anamnesis_questions").select("id,section,position,required,conditional_rule,question_definition_id,question_definitions(id,code,clinical_concept_id,label,help_text,field_type,options,validation)").eq("anamnesis_type_id",version.anamnesis_type_id).eq("active",true).order("position"),
  supabase.from("anamnesis_responses").select("question_definition_id,clinical_concept_id,value,source").eq("anamnesis_version_id",versionId)
]);
if (qErr) { root.innerHTML='<p class="texto-suave">Erro ao carregar as perguntas.</p>'; throw qErr; }

const qList=(questions||[]).filter(q=>q.question_definitions).sort((a,b)=>(a.position||0)-(b.position||0));
root.innerHTML='<div class="anamnese-form-card">'+montarDadosPessoais()+'</div>';
const answerMap=new Map((responses||[]).map(r=>[r.question_definition_id,r.value]));
const concepts=[...new Set(qList.map(q=>q.question_definitions.clinical_concept_id).filter(Boolean))];
const {data:previous}=concepts.length ? await supabase.from("patient_clinical_data").select("clinical_concept_id,value,valid_from").eq("patient_id",patientId).eq("is_current",true).in("clinical_concept_id",concepts) : {data:[]};
const previousMap=new Map((previous||[]).map(r=>[r.clinical_concept_id,r.value]));
const values=new Map();
(answerMap.size?answerMap:previousMap).forEach((v,k)=>values.set(k,v));

function normalizeValue(v){return v===null||v===undefined?"":v;}
function displayValue(v){ if(typeof v==="object") return Array.isArray(v)?v.join(", "):(v.text||v.value||JSON.stringify(v)); return String(v); }
function visible(q){
  const rule=q.conditional_rule; if(!rule) return true;
  const current=values.get(rule.question_definition_id); const expected=rule.value;
  if(rule.operator==="contains") return Array.isArray(current)&&current.includes(expected);
  return displayValue(current)===displayValue(expected);
}
function renderField(q){
  const d=q.question_definitions, opts=Array.isArray(d.options)?d.options:(d.options?.choices||[]);
  const id="q_"+d.id, current=normalizeValue(values.get(d.id));
  const req=q.required?" required":"";
  if(d.field_type==="radio"||d.field_type==="select"){
    const choices=opts.map(o=>typeof o==="string"?{value:o,label:o}:o);
    if(d.field_type==="select") return '<select id="'+id+'" data-q="'+d.id+'"'+req+'><option value="">Selecione…</option>'+choices.map(o=>'<option value="'+escapeHtml(o.value)+'" '+(displayValue(current)===displayValue(o.value)?"selected":"")+'>'+escapeHtml(o.label)+'</option>').join("")+'</select>';
    return '<div class="opcoes">'+choices.map(o=>'<label class="opcao"><input type="radio" name="'+id+'" data-q="'+d.id+'" value="'+escapeHtml(o.value)+'" '+(displayValue(current)===displayValue(o.value)?"checked":"")+(q.required?" required":"")+'><span>'+escapeHtml(o.label)+'</span></label>').join("")+'</div>';
  }
  if(d.field_type==="checkbox"){
    const selected=Array.isArray(current)?current:[]; const choices=opts.map(o=>typeof o==="string"?{value:o,label:o}:o);
    return '<div class="opcoes">'+choices.map(o=>'<label class="opcao"><input type="checkbox" data-q="'+d.id+'" value="'+escapeHtml(o.value)+'" '+(selected.includes(o.value)?"checked":"")+'><span>'+escapeHtml(o.label)+'</span></label>').join("")+'</div>';
  }
  if(d.field_type==="numeric") return '<input type="number" id="'+id+'" data-q="'+d.id+'" value="'+escapeHtml(current)+'"'+req+'>';
  if(d.field_type==="scale") return '<input type="number" id="'+id+'" data-q="'+d.id+'" value="'+escapeHtml(current)+'" min="'+escapeHtml(d.validation?.min??0)+'" max="'+escapeHtml(d.validation?.max??10)+'" step="1"'+req+'>';
  if(d.field_type==="upload"){ const existing=Array.isArray(current)?current:[]; return '<input type="file" id="'+id+'" data-upload-q="'+d.id+'" accept="image/*,.pdf" multiple> <div class="anamnese-help">Você poderá selecionar mais de um arquivo.</div>'+(existing.length?'<div class="anamnese-help"><strong>Arquivo(s) já anexado(s):</strong> '+existing.map(escapeHtml).join("<br>")+'</div>':""); }
  const multiline=d.field_type==="long_text";
  return multiline?'<textarea id="'+id+'" data-q="'+d.id+'" rows="5"'+req+'>'+escapeHtml(current)+'</textarea>':'<input type="text" id="'+id+'" data-q="'+d.id+'" value="'+escapeHtml(current)+'"'+req+'>';
}
let lastSection="";
root.insertAdjacentHTML("beforeend", qList.map((q,index)=>{
 const d=q.question_definitions; const section=q.section||"Anamnese"; const nextSection=qList[index+1]?.section||"Anamnese"; const heading=section!==lastSection?'<div class="anamnese-section"><h3 class="anamnese-section-title">'+escapeHtml(section)+'</h3>':""; lastSection=section;
 const prev=canEdit && d.clinical_concept_id && previousMap.has(d.clinical_concept_id) && !answerMap.has(d.id);
 const fechamento=section!==nextSection?'</div>':"";
 return heading+'<div class="anamnese-question" data-question-wrap="'+d.id+'"><label class="titulo" for="q_'+d.id+'">'+escapeHtml(d.label)+(q.required?' *':'')+'</label>'+(d.help_text?'<div class="anamnese-help">'+escapeHtml(d.help_text)+'</div>':"")+(prev?'<div class="previous-answer">Resposta anterior encontrada: <strong>'+escapeHtml(displayValue(previousMap.get(d.clinical_concept_id)))+'</strong><br><button type="button" class="btn-p btn-p-mini btn-p-dourado" data-manter="'+d.id+'">Manter resposta</button><button type="button" class="btn-p btn-p-mini btn-p-fora" data-alterar="'+d.id+'">Alterar resposta</button></div>':"")+renderField(q)+'<div class="erro-campo" data-error="'+d.id+'"></div></div>'+fechamento;
}).join("")+'<div class="anamnese-section" data-signature-anchor></div>');

root.querySelector("[data-cad=\"birth_date\"]")?.addEventListener("change",e=>{ const idade=root.querySelector("[data-idade]"); if(idade) idade.value=idadePorData(e.target.value); });
let assinatura=null;
if (canEdit) {
  const assinaturaWrap=document.createElement("div");
  assinaturaWrap.innerHTML='<div class="anamnese-section"><h3 class="anamnese-section-title">Declaração e assinatura</h3><p class="texto-suave">Ao assinar, você confirma que as informações fornecidas nesta ficha correspondem ao seu conhecimento atual.</p><div class="assinatura-wrap"><canvas id="anamnese-canvas"></canvas></div><div class="anamnese-actions"><button type="button" class="btn-p btn-p-fora" id="limpar-assinatura">Limpar assinatura</button></div></div>';
  root.appendChild(assinaturaWrap);
  const canvas=document.getElementById("anamnese-canvas");
  assinatura=criarAssinatura(canvas);
  requestAnimationFrame(()=>assinatura.redimensionar());
  document.getElementById("limpar-assinatura").onclick=()=>assinatura.limpar();
}

function readValue(d){
 const nodes=[...root.querySelectorAll('[data-q="'+d.id+'"]')];
 if(d.field_type==="checkbox") return nodes.filter(n=>n.checked).map(n=>n.value);
 if(d.field_type==="radio"){const n=nodes.find(n=>n.checked);return n?n.value:"";}
 const n=nodes[0]; return n?n.value:"";
}
function refreshVisibility(){
  qList.forEach(q=>{
    const wrap=root.querySelector('[data-question-wrap="'+q.question_definitions.id+'"]');
    if(wrap) wrap.style.display=visible(q)?"":"none";
  });
}
root.querySelectorAll("[data-q]").forEach(el=>el.addEventListener("input",()=>{
  const q=qList.find(q=>q.question_definitions.id===el.dataset.q);
  if(q){ values.set(el.dataset.q,readValue(q.question_definitions)); refreshVisibility(); atualizarProgresso(); }
}));
root.querySelectorAll("[data-q]").forEach(el=>el.addEventListener("change",()=>{
  const q=qList.find(x=>x.question_definitions.id===el.dataset.q);
  if(q){ values.set(el.dataset.q,readValue(q.question_definitions)); refreshVisibility(); atualizarProgresso(); }
}));
refreshVisibility();
atualizarProgresso();

root.querySelectorAll("[data-manter]").forEach(btn=>btn.onclick=()=>{
 const q=qList.find(x=>x.question_definitions.id===btn.dataset.manter); if(!q)return;
 values.set(q.question_definitions.id,previousMap.get(q.question_definitions.clinical_concept_id)); const field=root.querySelector('[data-q="'+q.question_definitions.id+'"]');
 if(field) {
  const val=values.get(q.question_definitions.id);
  if(q.question_definitions.field_type==="radio"){
    root.querySelectorAll('[data-q="'+q.question_definitions.id+'"]').forEach(x=>x.checked=x.value===displayValue(val));
  } else if(q.question_definitions.field_type==="checkbox"){
    const selected=Array.isArray(val)?val:[val];
    root.querySelectorAll('[data-q="'+q.question_definitions.id+'"]').forEach(x=>x.checked=selected.includes(x.value));
  } else field.value=displayValue(val);
}
btn.closest(".previous-answer").remove();
refreshVisibility(); atualizarProgresso();
});
root.querySelectorAll("[data-alterar]").forEach(btn=>btn.onclick=()=>btn.closest(".previous-answer").remove());

function atualizarProgresso(){
 const visiveis=qList.filter(q=>visible(q));
 const respondidas=visiveis.filter(q=>{const v=readValue(q.question_definitions);return v!==""&&(!Array.isArray(v)||v.length>0)}).length;
 const pct=visiveis.length?Math.round(respondidas/visiveis.length*100):0;
 const fill=document.querySelector("[data-progress-fill]"), count=document.querySelector("[data-progress-count]"), label=document.querySelector("[data-progress-label]");
 if(fill) fill.style.width=pct+"%"; if(count) count.textContent=pct+"%"; if(label) label.textContent=respondidas+" de "+visiveis.length+" perguntas respondidas";
}
const actions=document.createElement("div"); actions.className="anamnese-actions";
actions.innerHTML=(canEdit?'<button type="button" class="btn-p btn-p-dourado" id="enviar-anamnese">Enviar anamnese</button>':'')+'<a class="btn-p btn-p-fora" href="/painel/paciente/painel.html">Voltar</a><div class="anamnese-submit-status" data-submit-status role="status" aria-live="polite"></div>';
root.appendChild(actions);
const submitBtn=document.getElementById("enviar-anamnese");
if(!canEdit){
  actions.insertAdjacentHTML("beforebegin",'<div class="anamnese-status">Esta ficha está bloqueada para edição. Você pode apenas consultar as respostas registradas.</div>');
  root.querySelectorAll("input,select,textarea,button[data-manter],button[data-alterar]").forEach(el=>el.disabled=true);
}
if(version.status==="submitted"||version.status==="locked"){document.querySelector("[data-subtitulo]").textContent="Ficha preenchida e arquivada. Esta versão permanece preservada no seu prontuário.";}
else if((responses||[]).some(r=>r.source==="admin_preenchimento")){document.querySelector("[data-subtitulo]").textContent="Esta ficha foi pré-preenchida pela equipe. Revise, complete o que for necessário e assine para finalizar.";}

/* Uploads serão adicionados ao fluxo de submissão; por enquanto, campos upload ficam reservados para a etapa de anexos. */
if (submitBtn) submitBtn.onclick=async()=>{
 if(!canEdit)return;
 const missing=[];
 for(const q of qList){ if(!visible(q)||!q.required)continue; const v=readValue(q.question_definitions); if(v===""||(Array.isArray(v)&&!v.length)) missing.push(q); }
 if(missing.length){missing.forEach(q=>{const e=root.querySelector('[data-error="'+q.question_definitions.id+'"]');if(e)e.textContent="Este campo é obrigatório.";}); root.querySelector('[data-q="'+missing[0].question_definitions.id+'"]')?.scrollIntoView({behavior:"smooth",block:"center"}); return;}
 if(!assinatura || assinatura.estaVazia()){const status=root.querySelector("[data-submit-status]");if(status)status.textContent="Desenhe sua assinatura antes de enviar a ficha.";return;}
 submitBtn.disabled=true; submitBtn.textContent="Enviando…";
 try{
  const dadosPessoais={};
  root.querySelectorAll("[data-cad]").forEach(el=>{ dadosPessoais[el.dataset.cad]=el.value.trim(); });
  if(!dadosPessoais.full_name || !dadosPessoais.cpf || !dadosPessoais.birth_date){
    const status=root.querySelector("[data-submit-status]");if(status)status.textContent="Preencha Nome completo, CPF e Data de nascimento nos dados pessoais antes de enviar.";
    submitBtn.disabled=false; submitBtn.textContent="Enviar anamnese"; return;
  }
  const respostas=[];
  for (const q of qList.filter(q=>visible(q))) {
    const d=q.question_definitions;
    if (d.field_type==="upload") {
      const input=root.querySelector('[data-upload-q="'+d.id+'"]');
      const files=[...(input?.files||[])];
      const existing=Array.isArray(values.get(d.id))?values.get(d.id):[];
      if (q.required && !files.length && !existing.length) throw new Error("É necessário anexar os arquivos solicitados.");
      const paths=[...existing];
      for (const file of files) {
        const safeName=file.name.replace(/[^a-zA-Z0-9._-]+/g,"_");
        const filePath=patientId+"/anamneses/"+versionId+"/"+Date.now()+"-"+safeName;
        const {error}=await supabase.storage.from("documentos-pacientes").upload(filePath,file,{contentType:file.type||"application/octet-stream",upsert:false});
        if(error) throw error;
        paths.push(filePath);
        const {error:attErr}=await supabase.from("anamnesis_attachments").insert({
          anamnesis_version_id:versionId,patient_id:patientId,file_path:filePath,file_name:file.name,mime_type:file.type||null,file_size:file.size
        });
        if(attErr) throw attErr;
      }
      respostas.push({question_definition_id:d.id,clinical_concept_id:d.clinical_concept_id||null,value:paths,source:"anamnese"});
    } else {
      respostas.push({question_definition_id:d.id,clinical_concept_id:d.clinical_concept_id||null,value:readValue(d),source:"anamnese"});
    }
  }
  const blob=await assinatura.paraBlob();
  const path=patientId+"/assinaturas/anamnese-"+versionId+"-"+Date.now()+".png";
  const {error:upErr}=await supabase.storage.from("documentos-pacientes").upload(path,blob,{contentType:"image/png",upsert:false}); if(upErr)throw upErr;
  const {data:resultado, error:rpcErr}=await supabase.rpc("submit_anamnesis",{p_version_id:versionId,p_responses:respostas,p_signature_path:path,p_user_agent:navigator.userAgent,p_personal_data:dadosPessoais}); if(rpcErr)throw rpcErr;
  const novaVersao=resultado?.version_id && resultado.version_id!==versionId ? '<p style="margin:6px 0 0">A edição autorizada gerou uma nova versão histórica; a versão anterior foi preservada.</p>' : "";
  root.innerHTML='<div class="anamnese-status"><strong>Anamnese enviada com sucesso.</strong><p style="margin:6px 0 0">Sua ficha foi registrada e assinada. Esta versão ficará disponível no seu prontuário.</p>'+novaVersao+'<a class="btn-p btn-p-dourado" style="margin-top:12px" href="/painel/paciente/painel.html">Voltar ao Meu espaço</a></div>';
 }catch(e){console.error("Falha ao enviar anamnese:",e);submitBtn.disabled=false;submitBtn.textContent="Enviar anamnese";const status=root.querySelector("[data-submit-status]");if(status)status.textContent="Não foi possível enviar a ficha agora. Seus dados permanecem nesta tela. Tente novamente em alguns instantes.";}
};
</script>
