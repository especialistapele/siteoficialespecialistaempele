<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Entrar — Especialista em Pele</title>
<link rel="stylesheet" href="/painel/assets/css/painel.css">
<link rel="icon" href="/assets/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="512x512" href="/assets/favicon-512.png">
<link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
</head>
<body data-pagina="contato">

<div class="painel-login">
  <div class="painel-login__card">
    <div class="painel-login__logo"><img src="/painel/assets/img/logo-especialista.webp" alt="Especialista em Pele — Danielle Brito"></div>

    <div class="aviso-flash" data-flash aria-live="polite" role="status"></div>

    <form id="form-login">
      <div class="form-campo">
        <label for="email">E-mail</label>
        <input type="email" id="email" required autocomplete="username">
      </div>
      <div class="form-campo">
        <label for="senha">Senha</label>
        <input type="password" id="senha" required autocomplete="current-password">
      </div>
      <button type="submit" class="btn-p btn-p-dourado" style="width:100%;justify-content:center" id="botao-entrar">Entrar</button>
    </form>

    <p class="texto-suave" style="font-size:12.5px;margin-top:20px">
      Ainda não tem acesso? <a href="/contato.html" style="color:var(--gold);font-weight:700">Fale com a gente</a>.
    </p>
  </div>
</div>

<script>
  // Bloqueia o submit nativo imediatamente para não perder os campos caso
  // o módulo de autenticação falhe ao carregar.
  const formLogin = document.getElementById("form-login");
  const flashLogin = document.querySelector("[data-flash]");
  formLogin.addEventListener("submit", (event) => event.preventDefault());

  (async () => {
    const botao = document.getElementById("botao-entrar");
    const emailInput = document.getElementById("email");
    const senhaInput = document.getElementById("senha");
    const mostrarMensagem = (mensagem) => {
      flashLogin.textContent = mensagem;
      flashLogin.className = "aviso-flash visivel erro";
    };
    let autenticar;

    try {
      const modulo = await import("/painel/assets/js/painel-auth.js");
      const { supabase, resolverDestino, mostrarFlash } = modulo;
      const params = new URLSearchParams(window.location.search);

      if (params.get("erro") === "acesso") mostrarFlash(flashLogin, "Esta conta não tem acesso ao painel.", "erro");
      if (params.get("erro") === "temporario") mostrarFlash(flashLogin, "Não foi possível validar o acesso agora. Tente novamente em instantes.", "erro");
      if (params.get("erro") === "saida") mostrarFlash(flashLogin, "A saída foi solicitada, mas não foi possível confirmá-la com o servidor. A sessão local foi encerrada quando possível; entre novamente para continuar.", "erro");

      const { data, error: erroSessao } = await supabase.auth.getSession();
      if (erroSessao) {
        mostrarMensagem("Não foi possível validar a sessão. Tente novamente em instantes.");
      } else if (data?.session && params.get("erro") !== "saida") {
        const destino = await resolverDestino(data.session.user.id);
        if (destino) { window.location.replace(destino.destino); return; }
        mostrarMensagem("Não foi possível validar as permissões desta conta. Tente novamente em instantes.");
      }

      autenticar = async (event) => {
        event.preventDefault();
        if (botao.disabled) return;
        botao.disabled = true;
        botao.textContent = "Entrando…";
        flashLogin.textContent = "";
        flashLogin.className = "aviso-flash";

        try {
          const { data: loginData, error } = await supabase.auth.signInWithPassword({
            email: emailInput.value.trim(),
            password: senhaInput.value,
          });

          if (error || !loginData?.user?.id) {
            // Mensagem única para não revelar se o e-mail está cadastrado.
            mostrarFlash(flashLogin, "Não foi possível entrar com essas credenciais. Confira os dados e tente novamente.", "erro");
            return;
          }

          const destino = await resolverDestino(loginData.user.id);
          if (!destino) {
            try { await supabase.auth.signOut({ scope: "local" }); } catch {}
            mostrarFlash(flashLogin, "Não foi possível validar as permissões desta conta. Se o problema continuar, entre em contato com a clínica.", "erro");
            return;
          }

          window.location.replace(destino.destino);
        } catch {
          mostrarFlash(flashLogin, "Não foi possível conectar ao sistema. Verifique sua conexão e tente novamente.", "erro");
        } finally {
          botao.disabled = false;
          botao.textContent = "Entrar";
        }
      };

      formLogin.addEventListener("submit", autenticar);
    } catch {
      mostrarMensagem("O sistema de login não conseguiu carregar. Atualize a página e tente novamente.");
      botao.disabled = true;
    }
  })();
</script>
</body>
</html>
