name: Atualizar sitemap.xml e páginas estáticas (tratamentos, artigos e resultados)

on:
  schedule:
    # De hora em hora (rede de segurança: o painel também dispara este
    # workflow na hora, via Edge Function "disparar-publicacao").
    - cron: "0 * * * *"
  workflow_dispatch: {}   # botão "Run workflow" manual, na aba Actions
  push:
    branches: [main]      # também roda quando você fizer deploy do site

permissions:
  contents: write

# Uma execução por vez: evita dois builds tentando enviar commits ao mesmo tempo.
concurrency:
  group: atualizar-site
  cancel-in-progress: false

jobs:
  atualizar-sitemap:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Gerar páginas estáticas de tratamentos a partir do Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: node scripts/gerar-paginas-tratamentos.mjs

      - name: Gerar páginas estáticas de artigos do blog (/blog/<slug>.html)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: node scripts/gerar-paginas-artigos.mjs

      - name: Gerar páginas estáticas de resultados (/resultados/<slug>.html)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: node scripts/gerar-paginas-resultados.mjs

      - name: Gerar sitemap.xml a partir do Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: node scripts/gerar-sitemap.mjs

      - name: Confirmar e enviar, só se algo mudou
        run: |
          git config user.name "sitemap-bot"
          git config user.email "actions@github.com"
          # -A registra também as páginas APAGADAS (despublicadas/excluídas)
          git add -A sitemap.xml tratamentos blog resultados
          if git diff --staged --quiet; then
            echo "Nada mudou — nada para enviar."
          else
            git commit -m "chore: atualizar sitemap.xml e páginas estáticas (tratamentos, artigos, resultados) automaticamente"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push
          fi
