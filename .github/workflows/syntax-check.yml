name: Validação de sintaxe dos HTML

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar código
        uses: actions/checkout@v7.0.1
      - name: Configurar Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: 22
      - name: Validar JavaScript inline dos HTML
        run: node scripts/check-inline-js.mjs
