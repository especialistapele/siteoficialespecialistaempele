name: Teste de acessibilidade das capas do blog

on:
  pull_request:
    paths:
      - "scripts/gerar-paginas-artigos.mjs"
      - "scripts/test-seo-alt-capas.mjs"
      - ".github/workflows/test-seo-alt-capas.yml"
  push:
    branches: [main, "seo/descriptive-cover-alt"]
    paths:
      - "scripts/gerar-paginas-artigos.mjs"
      - "scripts/test-seo-alt-capas.mjs"
      - ".github/workflows/test-seo-alt-capas.yml"

permissions:
  contents: read

jobs:
  test-alt-capas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Testar alt descritivo das capas
        run: node scripts/test-seo-alt-capas.mjs
