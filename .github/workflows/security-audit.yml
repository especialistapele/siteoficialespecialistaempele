name: Security audit checks

on:
  pull_request:
    branches: [main]
    paths:
      - "painel/assets/js/painel-auth.js"
      - "painel/index.html"
      - "tests/painel-auth-security.mjs"
      - "docs/SECURITY_AUDIT.md"
      - ".github/workflows/security-audit.yml"
  push:
    branches: ["security/audit-hardening"]
    paths:
      - "painel/assets/js/painel-auth.js"
      - "painel/index.html"
      - "tests/painel-auth-security.mjs"
      - ".github/workflows/security-audit.yml"

permissions:
  contents: read

jobs:
  auth-security:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Static auth security regression checks
        run: node tests/painel-auth-security.mjs
