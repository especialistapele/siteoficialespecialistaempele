name: Security audit checks

on:
  pull_request:
    branches: [main]
    paths:
      - "painel/assets/js/painel-auth.js"
      - "supabase/functions/create-patient/index.ts"
      - "supabase/functions/disparar-publicacao/index.ts"
      - "supabase/functions/reconciliar-publicacao/index.ts"
      - "painel/assets/js/admin-sidebar.js"
      - "painel/paciente/painel.html"
      - "painel/assets/js/sanitize.js"
      - "assets/js/rich-text.js"
      - "assets/js/sanitize.js"
      - "assets/js/supabase-client.js"
      - "painel/index.html"
      - "painel/admin/dashboard.html"
      - "painel/admin/paciente.html"
      - "painel/admin/configuracoes.html"
      - "tests/painel-auth-security.mjs"
      - "docs/SECURITY_AUDIT.md"
      - ".github/workflows/security-audit.yml"
  push:
    branches: ["security/audit-hardening"]
    paths:
      - "docs/SECURITY_AUDIT.md"
      - "painel/assets/js/painel-auth.js"
      - "supabase/functions/create-patient/index.ts"
      - "supabase/functions/disparar-publicacao/index.ts"
      - "supabase/functions/reconciliar-publicacao/index.ts"
      - "painel/assets/js/admin-sidebar.js"
      - "painel/paciente/painel.html"
      - "painel/assets/js/sanitize.js"
      - "assets/js/rich-text.js"
      - "assets/js/sanitize.js"
      - "assets/js/supabase-client.js"
      - "painel/index.html"
      - "tests/painel-auth-security.mjs"
      - ".github/workflows/security-audit.yml"

permissions:
  contents: read

jobs:
  auth-security:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
      - name: Setup Node
        uses: actions/setup-node@v7.1.0
        with:
          node-version: 22
      - name: Syntax-check changed ES modules
        run: |
          node --input-type=module --check < painel/assets/js/painel-auth.js
          node --input-type=module --check < painel/assets/js/admin-sidebar.js
          node --input-type=module --check < painel/assets/js/sanitize.js
          node --input-type=module --check < assets/js/rich-text.js
      - name: Static auth security regression checks
        run: node tests/painel-auth-security.mjs
