name: Gerar montagens estáticas de antes e depois

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  gerar-montagens:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4
        with:
          ref: seo/montagens-antes-depois-actions

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar Pillow
        run: python -m pip install --upgrade pillow requests

      - name: Baixar pares originais e montar imagens
        run: python .github/scripts/gerar_montagens_antes_depois.py

      - name: Salvar imagens geradas no branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add images/antes-depois-*.webp
          if git diff --cached --quiet; then
            echo "Nenhuma montagem nova ou alterada."
            exit 0
          fi
          git commit -m "SEO: gerar montagens estáticas de antes e depois"
          git push origin HEAD:seo/montagens-antes-depois-actions
