name: Bot triagem — validação

on:
  push:
    branches:
      - feature/bot-triagem-deterministico
      - feature/bot-auditor-instalacao
      - feature/bot-instalador-automatico
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20
      - name: Validar JavaScript do bot
        run: |
          node --check assets/js/bot-config.js
          node --check assets/js/bot-triagem.js
          node --check assets/js/bot-tratamentos-auto.js
          node --check scripts/instalar-bot-tratamentos.mjs
          node --check assets/js/whatsapp.js
          node --check tests/bot-triagem-rotas.mjs
          node --check tests/bot-triagem-cobertura.mjs
          node --check tests/bot-triagem-comportamento.mjs
          node --check tests/bot-triagem-cenarios.mjs
          node --check tests/bot-triagem-auditor.mjs
      - name: Teste — rotas de tratamento
        run: node tests/bot-triagem-rotas.mjs
      - name: Teste — cobertura das páginas
        run: node tests/bot-triagem-cobertura.mjs
      - name: Teste — comportamento
        run: node tests/bot-triagem-comportamento.mjs
      - name: Teste — cenários e fluxo
        run: node tests/bot-triagem-cenarios.mjs
      - name: Teste — instalador automático
        run: node tests/bot-triagem-instalador.mjs
      - name: Auditoria — instalação e configuração
        run: node tests/bot-triagem-auditor.mjs
